<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/src/assets/djago-logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DjagoYelen</title>
  </head>
  <body>
    <div id="root">
      <div class="splash-screen">
        <div class="splash-center">
          <div class="spinner"></div>
        </div>

        <div class="splash-bottom">
          <h1 class="app-name">DjagoYelen</h1>
          <div class="progress-container">
            <div class="progress-bar"></div>
          </div>
        </div>
      </div>

      <style>
        /* Styles critiques embarqués pour un affichage instantané sans flash blanc */
        .splash-screen {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          background-color: #0A3B2F; /* Ton vert principal */
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          align-items: center;
          padding: 60px 20px;
          box-sizing: border-box;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          z-index: 99999;
        }

        .splash-center {
          flex: 1;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        /* Spinner discret au centre */
        .spinner {
          width: 45px;
          height: 45px;
          border: 3px solid rgba(255, 255, 255, 0.1);
          border-radius: 50%;
          border-top-color: #E97223; /* Ton accent orange */
          animation: spin 1s ease-in-out infinite;
        }

        .splash-bottom {
          width: 100%;
          max-width: 280px;
          text-align: center;
          display: flex;
          flex-direction: column;
          gap: 15px;
        }

        .app-name {
          color: #ffffff;
          font-size: 1.6rem;
          font-weight: 700;
          letter-spacing: 1px;
          margin: 0;
        }

        /* Conteneur de la barre */
        .progress-container {
          width: 100%;
          height: 4px;
          background-color: rgba(255, 255, 255, 0.1);
          border-radius: 2px;
          overflow: hidden;
          position: relative;
        }

        /* Barre de chargement infinie et fluide */
        .progress-bar {
          width: 40%;
          height: 100%;
          background-color: #E97223; /* Ton accent orange */
          border-radius: 2px;
          position: absolute;
          left: -40%;
          animation: loading 1.6s ease-in-out infinite;
        }

        @keyframes spin {
          to { transform: rotate(360deg); }
        }

        @keyframes loading {
          from { left: -40%; }
          to { left: 100%; }
        }
      </style>
    </div>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
